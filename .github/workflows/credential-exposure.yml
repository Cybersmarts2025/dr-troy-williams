name: Credential exposure scan
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 11 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: credential-exposure-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secret-scan:
    name: Full history and current files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout all history without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 \
            --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check --strict
          mkdir -p credential-scanner
          tar -xzf gitleaks.tar.gz -C credential-scanner gitleaks
          "$RUNNER_TEMP/credential-scanner/gitleaks" version
      - name: Scan without exposing credentials in logs
        shell: bash
        run: |
          set -euo pipefail
          scan_dir=$(mktemp -d "$RUNNER_TEMP/credential-audit.XXXXXX")
          trap 'rm -rf "$scan_dir"' EXIT
          printf '[extend]\nuseDefault = true\n' > "$scan_dir/config.toml"
          touch "$scan_dir/ignore"
          scanner="$RUNNER_TEMP/credential-scanner/gitleaks"
          set +e
          "$scanner" git --log-opts="--all --full-history" \
            --config="$scan_dir/config.toml" --gitleaks-ignore-path="$scan_dir/ignore" \
            --ignore-gitleaks-allow --redact=100 --no-banner --no-color \
            --max-decode-depth=2 --max-archive-depth=2 \
            --report-format=json --report-path="$scan_dir/history.json" . \
            > "$scan_dir/history.log" 2>&1
          history_status=$?
          "$scanner" dir --config="$scan_dir/config.toml" \
            --gitleaks-ignore-path="$scan_dir/ignore" --ignore-gitleaks-allow \
            --redact=100 --no-banner --no-color \
            --max-decode-depth=2 --max-archive-depth=2 \
            --report-format=json --report-path="$scan_dir/current.json" . \
            > "$scan_dir/current.log" 2>&1
          current_status=$?
          set -e
          python3 - "$scan_dir" "$history_status" "$current_status" <<'PY'
          import json, os, pathlib, sys
          directory = pathlib.Path(sys.argv[1])
          statuses = [int(x) for x in sys.argv[2:]]
          rows = []
          errors = []
          for mode, status in zip(("history", "current"), statuses):
              report = directory / (mode + ".json")
              if status not in (0, 1) or not report.exists():
                  errors.append(mode)
                  continue
              try:
                  items = json.loads(report.read_text())
                  if not isinstance(items, list):
                      raise ValueError("Invalid report")
              except Exception:
                  errors.append(mode)
                  continue
              if status == 1 and not items:
                  errors.append(mode)
              for item in items:
                  rows.append((mode, item.get("RuleID", ""), item.get("File", ""),
                               item.get("StartLine", ""), item.get("Commit", "")[:12]))
          def clean(value):
              return str(value).replace("\n", " ").replace("\r", " ").replace("|", "/").replace("`", "")[:250]
          lines = ["## Credential exposure scan", "",
                   "Gitleaks 8.30.1; all fetched Git refs plus current files.",
                   "Pattern detections require triage; credential validity is not tested.", ""]
          if errors:
              lines += ["SCAN ERROR: " + ", ".join(errors) + ". No clean status can be inferred.", ""]
          if rows:
              lines += [f"{len(rows)} detections (history/current may overlap).", "",
                        "| Scope | Rule | File | Line | Commit |", "|---|---|---|---|---|"]
              lines += ["| " + " | ".join(clean(x) for x in row) + " |" for row in rows[:100]]
              lines += ["", "Revoke confirmed exposed credentials at their provider, update dependents,",
                        "verify the old credential is invalid, then remediate repository content.",
                        "Never post credential values in issues, comments, logs, or artifacts."]
          elif not errors:
              lines += ["No detections by this scanner. This is not a guarantee of security."]
          summary = "\n".join(lines) + "\n"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write(summary)
          print(summary)
          sys.exit(2 if errors else 1 if rows else 0)
          PY
